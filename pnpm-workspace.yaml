packages:
  - apps/*
  - services/*
  - packages/*

engineStrict: true

# Dependencies allowed to run install scripts (everything else is blocked).
allowBuilds:
  "@sentry/cli": true # official Sentry uploader (source maps), downloads its binary
  esbuild: true
  # CPU binaries ship in the package; the script only fetches GPU extras: kept off.
  onnxruntime-node: false
  # Its script only rebuilds its own sources: not needed.
  protobufjs: false

# Official Expo SDK 57 packages, exempted by `expo install` from the minimum
# release age protection. Review at each SDK upgrade.
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.27"
  - "@expo/router-server@57.0.11"
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - "@expo/ui@57.0.20"
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-router@57.0.23

# Audit exceptions (decision of the owner, 02/10/2026): one advisory each, with no
# patched version and outside the shipped app. Reviewed at each Expo SDK upgrade.
auditConfig:
  ignoreGhsas:
    # node-forge <=1.4.0, RSA signature verification: only in @expo/cli, which uses
    # it to sign (dev manifests, local iOS builds), never to verify.
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3, stack exhaustion on deeply nested patterns (owner's decision,
    # 03/10/2026): only in Metro and Jest, through micromatch, fed with the project's
    # own glob patterns; absent from the app, the API, the console and ingestion.
    - GHSA-vfj7-8cjw-p6xm

# Patched versions forced for vulnerable transitive dependencies (fixed versions
# exist, so no audit exception): build tooling only, never in the shipped app.
overrides:
  # GHSA-pqg4-j6r4-53mv (critical): via react-native > react-devtools-core.
  "shell-quote@<1.11.0": "1.11.0"
  # GHSA-68fv-2mgg-jv7q (high): via the bundlers.
  "source-map-js@<1.2.2": "1.2.2"
  # Thirteen high advisories up to 0.8.14: via @bacons/apple-targets > @expo/plist.
  "@xmldom/xmldom@<0.8.15": "0.8.15"
