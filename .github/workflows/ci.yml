name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  quality:
    name: Format, lint, types, tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - name: Fonts carry every French and Wolof letter
        run: pnpm fonts:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Shell guard (secrets, inline scripts) behaves as tested
        run: pnpm test:hooks

  build:
    name: Production builds
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: API bundle
        run: pnpm --filter @bgs/api build
      - name: Admin (Next.js)
        run: pnpm --filter @bgs/admin build
      - name: Mobile JS bundles (Android + iOS, Hermes)
        run: pnpm --filter @bgs/mobile bundle:check
      - name: Mobile bundle weight budget
        run: pnpm bundle:size
      - name: Mobile web export (accessibility audit)
        run: pnpm --filter @bgs/mobile export:web
      - name: Accessibility audit (axe-core, WCAG 2.2 A/AA, light and dark)
        run: pnpm a11y
      - name: End-to-end journeys (app web export and console)
        run: pnpm e2e

  containers:
    name: Container images
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API, console and collection images
        run: |
          docker build -f infra/docker/api.Dockerfile -t bgs-api .
          docker build -f infra/docker/console.Dockerfile -t bgs-console .
          docker build -f infra/docker/ingestion.Dockerfile -t bgs-ingestion .
      - name: No secret or data inside the images
        run: |
          for image in bgs-api bgs-console bgs-ingestion; do
            found=$(docker run --rm --entrypoint sh "$image" -c 'find / -xdev \( -name ".env" -o -name ".env.local" -o -name "accounts.json" \) 2>/dev/null || true')
            if [ -n "$found" ]; then echo "Found in $image: $found"; exit 1; fi
          done
      - name: The API and the console start and answer
        run: |
          docker network create bgs
          docker run -d --name api --network bgs -p 3000:3000 bgs-api
          docker run -d --name console --network bgs -e API_URL=http://api:3000 -p 3001:3001 bgs-console
          for url in http://127.0.0.1:3000/v1/health http://127.0.0.1:3001/connexion; do
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url"; then echo "$url answers"; continue 2; fi
              sleep 2
            done
            docker logs api; docker logs console; exit 1
          done
      - name: Processes run without administrator rights
        run: |
          test "$(docker exec api id -u)" != "0"
          test "$(docker exec console id -u)" != "0"

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed later is still leaked
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup
      - name: Known vulnerabilities (high and critical fail the build)
        run: pnpm audit --audit-level high
