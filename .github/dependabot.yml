version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "vitest", "@vitest/*"]
    ignore:
      # Versions chosen by the Expo SDK: they move only with an SDK upgrade
      # (`expo install --fix`, task UPG-01), never one by one. React must equal the
      # renderer version inside react-native exactly, or the app crashes at launch
      # (tests do not catch it). Known vulnerabilities are still caught by the
      # `pnpm audit` step of CI.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react*"
      - dependency-name: "jest"
      - dependency-name: "@types/jest"
      - dependency-name: "jest-expo"
      # Types follow the Node.js runtime of the project (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
